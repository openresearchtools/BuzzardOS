evidence = ["NOTICE", "LICENSE"]
provenance = "Independently authored geometric SVG for this project; no third-party path data or artwork was copied."
status = "project-authored-and-licensed"

[[asset]]
id = "wildbuzzard-graphite-gtk-theme"
paths = ["guest/assets/themes/WildBuzzard/**"]
license = "AGPL-3.0-or-later"
