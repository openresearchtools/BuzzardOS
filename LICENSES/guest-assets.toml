schema = 1
audited_at = "2026-08-27"

[[asset]]
id = "buzzardos-project-assets"
paths = [
  "guest/assets/**",
  "host/packaging/BuzzardOS.desktop",
  "host/packaging/buzzardos.apparmor",
  "host/packaging/buzzardos-nvidia-container-cli",
  "host/packaging/generate-icons.sh",
]
exclude = ["guest/assets/themes/BuzzardOS-Dark/**", "guest/assets/themes/BuzzardOS-Light/**", "guest/assets/themes/BuzzardOS-Shared/**", "guest/assets/icons/BuzzardOS/**"]
license = "AGPL-3.0-or-later"
evidence = ["LICENSE"]
status = "covered-by-repository-license"

[[asset]]
id = "buzzardos-metainfo"
paths = ["host/packaging/org.openresearchtools.BuzzardOS.metainfo.xml"]
license = "CC0-1.0"
evidence = ["host/packaging/org.openresearchtools.BuzzardOS.metainfo.xml:metadata_license"]
status = "declared-inline"

[[asset]]
id = "buzzardos-application-icons"
paths = [
  "host/packaging/icons/**",
  "guest/assets/icons/BuzzardOS/scalable/apps/**",
  "guest/assets/icons/BuzzardOS/symbolic/apps/**",
]
license = "AGPL-3.0-or-later"
evidence = ["LICENSE", "NOTICE", "host/packaging/icons/README.md"]
provenance = "The native application icon uses the user-approved original Low Glide project artwork, digest-bound in host/packaging/icons/README.md. Guest monitor and settings glyphs remain independently authored project assets."
status = "project-authored-and-licensed"

[[asset]]
id = "buzzardos-graphite-gtk-theme"
paths = ["guest/assets/themes/BuzzardOS-Dark/**", "guest/assets/themes/BuzzardOS-Light/**", "guest/assets/themes/BuzzardOS-Shared/**"]
license = "AGPL-3.0-or-later"
runtime_import = "resource:///org/gtk/libgtk/theme/Adwaita/gtk-contained.css"
evidence = ["NOTICE", "LICENSE", "guest/assets/themes/BuzzardOS-Dark/gtk-3.0/gtk.css", "guest/assets/themes/BuzzardOS-Light/gtk-3.0/gtk.css", "guest/assets/themes/BuzzardOS-Shared/gtk-3.0/geometry.css"]
notes = "Independently authored project CSS shared by conservative dark and light palette variants. The palette was selected by visual observation of common creative-tool interfaces; no third-party stylesheet or artwork was copied. GTK 3 imports the guest's separately packaged Adwaita resource rather than copying it."
status = "project-authored-and-licensed"

[[asset]]
id = "buzzardos-folder-icon-theme"
paths = [
  "guest/assets/icons/BuzzardOS/index.theme",
  "guest/assets/icons/BuzzardOS/scalable/mimetypes/**",
  "guest/assets/icons/BuzzardOS/scalable/places/**",
  "guest/assets/icons/BuzzardOS/symbolic/mimetypes/**",
  "guest/assets/icons/BuzzardOS/symbolic/places/**",
]
license = "AGPL-3.0-or-later"
evidence = ["NOTICE", "LICENSE", "guest/assets/icons/BuzzardOS/index.theme"]
notes = "Independently authored simple folder SVG geometry and symbolic paths. A warm orange palette was requested by the product design; no Mint-Y SVG path data or artwork was copied."
status = "project-authored-and-licensed"

[[asset]]
id = "wayland-virtual-keyboard-protocol"
paths = ["cua/protocol/virtual-keyboard-unstable-v1.xml"]
license = "MIT"
evidence = ["cua/protocol/virtual-keyboard-unstable-v1.xml:copyright"]
status = "recorded-inline"
