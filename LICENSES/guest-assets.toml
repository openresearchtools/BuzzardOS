notes = "Independently authored project CSS. The palette was selected by visual observation of common dark creative-tool interfaces; no third-party stylesheet or artwork was copied. GTK 3 imports the guest's separately packaged Adwaita resource rather than copying it."
status = "project-authored-and-licensed"

[[asset]]
id = "wildbuzzard-folder-icon-theme"
paths = ["guest/assets/icons/WildBuzzard/**"]
license = "AGPL-3.0-or-later"
evidence = ["NOTICE", "LICENSE", "guest/assets/icons/WildBuzzard/index.theme"]
notes = "Independently authored simple folder SVG geometry and symbolic paths. A warm orange palette was requested by the product design; no Mint-Y SVG path data or artwork was copied."
status = "project-authored-and-licensed"

