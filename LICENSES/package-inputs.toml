schema = 1
audited_at = "2026-08-30"
containerfile = "oci/desktop/Containerfile"
notes = "The standard Containerfile bootstraps the signed Open Research Tools APT repository with a checksum-pinned archive-keyring package and installs exact versions of the three independently published Buzzard OS guest packages. Their Debian control metadata declares the distro dependency closure. Debian package resolution is frozen by the dated snapshot source during construction, while the installed live Debian and Open Research Tools sources keep the persistent machine APT-updatable. The optional CUDA variant adds exact-version NVIDIA repository packages after the complete standard definition. Base-image index, amd64 manifest, config, and layer identities are recorded in oci/base-images.lock.toml."

[[base_image]]
reference = "docker.io/library/debian:sid"
used_by = ["runtime"]
digest = "sha256:900a6f89c05e3f3323f274eb9ce3bb2d35695fac097360dfc6f1cfe2e921996b"
index_digest = "sha256:24c766c06ebdbda66a026e92361ede7d9212819701b2fca82e347ef0c240cb2c"
apt_snapshot = "20260803T000000Z"

[[apt_block]]
order = 1
stage = "runtime"
surface = "oci"
packages = ["ca-certificates", "wget"]
notes = "Bootstrap tools are resolved from the immutable Debian snapshot. The downloaded keyring package is independently checksum-pinned below."

[[repository_package_block]]
order = 2
stage = "runtime"
surface = "oci"
containerfile = "oci/desktop/Containerfile"
resolution = "exact Buzzard package versions from the signed Open Research Tools APT repository authenticated by the checksum-pinned archive-keyring package"
repository_key_sha256 = "e46f7b021b56748c749f49afa3ef97974e96fceeedeb0f2ac7ecbef8b676c441"
packages = ["buzzardoscua=${BUZZARDOS_CUA_VERSION}", "buzzardos-guest=${BUZZARDOS_GUEST_VERSION}", "buzzardos-desktop=${BUZZARDOS_DESKTOP_VERSION}"]

[[repository_package_block]]
order = 3
stage = "runtime-cuda"
surface = "oci"
containerfile = "oci/desktop/Containerfile.cuda"
resolution = "exact package versions from NVIDIA's Debian 13 repository authenticated by the pinned cuda-keyring package"
repository_key_sha256 = "d0d4ef986a44400f9db33c600ef33a985175e7cc63d805a10e1839c7a1e78f5f"
keyring_source = "https://github.com/NVIDIA/apt-packaging-cuda-keyring"
keyring_source_tag = "v1.1"
keyring_source_commit = "c63770f25b9ece2006956c9be86a72b20c2e67ba"
keyring_license = "MIT"
keyring_license_sha256 = "be0f15ae130d46adb2c2aed7229518da353f28f1471d80b4dce62d909c6ceb2d"
packages = ["cuda-cudart-13-3=${NV_CUDA_CUDART_VERSION}", "cuda-toolkit-13-3-config-common=${NV_CUDA_CUDART_VERSION}", "cuda-toolkit-13-config-common=${NV_CUDA_CUDART_VERSION}", "cuda-toolkit-config-common=${NV_CUDA_CUDART_VERSION}", "cuda-compat-13-3=${NV_CUDA_COMPAT_VERSION}", "cuda-libraries-13-3=${NV_CUDA_LIB_VERSION}", "libnpp-13-3=${NV_LIBNPP_VERSION}", "cuda-nvtx-13-3=${NV_NVTX_VERSION}", "libcusparse-13-3=${NV_LIBCUSPARSE_VERSION}", "libcublas-13-3=${NV_LIBCUBLAS_VERSION}", "libnccl2=${NV_LIBNCCL_PACKAGE_VERSION}"]
