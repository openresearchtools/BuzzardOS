notes = "Wild Buzzard builds this runtime locally from the exact archives below with Zig's checksum-pinned musl target. It does not consume Alpine packages, host GCC, or the mutable AppImage continuous runtime binary. Wild Buzzard's emitted C changes are additionally licensed under MIT in LICENSES/wildbuzzard-appimage-runtime-patch-MIT. Two clean external builds produced byte-identical runtime, debug, source, object, and relink-kit outputs. The deterministic build script applies Wild Buzzard's native-FUSE-first automatic extract-and-run fallback and fixes the upstream musl cleanup descriptor budget before compilation. The bundled relink kit contains the complete libfuse and runtime source archives, the upstream libfuse patch, all non-LGPL static objects/archives, the linker script, and a deterministic relink command. A recipient supplies a modified x86_64-linux-musl libfuse3.a and can reproduce the shipped runtime byte-for-byte with the pinned Zig toolchain."

