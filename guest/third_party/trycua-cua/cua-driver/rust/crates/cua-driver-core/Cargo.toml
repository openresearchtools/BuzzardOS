[package]
name = "cua-driver-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["yaml", "rego"]
yaml = ["dep:serde_yaml_ng", "dep:regex"]
rego = ["dep:regorus"]

[dependencies]
cua-driver-contract = { path = "../cua-driver-contract" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1"
serde_yaml_ng = { version = "0.10", optional = true }
regex = { version = "1", optional = true }
regorus = { version = "0.10.1", optional = true }
# Used by the shared `image_utils` module for pure PNG/JPEG/resize/crosshair
# processing in the Linux capture path.
image = { workspace = true }
# Used by the `browser` module's pooled CDP browser-endpoint WebSocket. No TLS
# features: the endpoint contract is loopback ws:// only.
tokio-tungstenite = "0.24"
futures-util = "0.3"
uuid = { workspace = true }
base64 = { workspace = true }
sha2 = "0.10"
url = "2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
