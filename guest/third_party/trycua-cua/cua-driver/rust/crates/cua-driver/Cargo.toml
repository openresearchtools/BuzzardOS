[package]
name = "cua-driver"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Linux Sway/Xwayland computer-use automation daemon (MCP server)"
default-run = "cua-driver"

[[bin]]
name = "cua-driver"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
cua-driver-core = { path = "../cua-driver-core" }
cua-driver-sdk = { path = "../cua-driver-sdk" }
cursor-overlay = { path = "../cursor-overlay" }
pip-preview = { path = "../pip-preview" }
async-trait = "0.1"
base64 = { workspace = true }
uuid = { workspace = true }
# Used by process/session helpers on Linux.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
platform-linux = { path = "../platform-linux" }

[features]
default = []
# GNOME/KDE portal input ships in ordinary Linux releases; PipeWire capture
# remains a separate modern-desktop feature. The combined name stays as a
# compatibility alias for Nix and downstream builds.
portal-input = ["platform-linux/portal-input"]
portal-capture = ["platform-linux/portal-capture"]
portal-libei = ["platform-linux/portal-libei"]

[dev-dependencies]
# Shared integration-test harness (MCP/CLI transports, child reaping, paths,
# response accessors). Dev-only — never linked into the shipped driver.
cua-driver-testkit = { path = "../cua-driver-testkit" }
cua-driver-contract = { path = "../cua-driver-contract" }
tokio = { workspace = true, features = ["full"] }
image = { workspace = true }
base64 = { workspace = true }
tempfile = "3"
semver = "1"
futures-util = "0.3"
tokio-tungstenite = "0.24"
