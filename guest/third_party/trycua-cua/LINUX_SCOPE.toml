retained_shared_contract = "Shared Rust contract, SDK, daemon, browser, policy, recording, and testkit source can retain serialized platform-labelled enum variants and cfg-gated compatibility branches where the upstream public wire contract or shared source layout requires them. No non-Linux platform backend crate, test target, direct platform dependency, build resource, or skill guide is included."

[attribution]
upstream_record = "UPSTREAM.toml"
