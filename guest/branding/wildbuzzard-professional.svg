<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Wild Buzzard</title>
  <desc id="description">A calm three-quarter common buzzard in graphite, warm ivory, and cinnamon orange.</desc>
  <defs>
    <linearGradient id="graphite" x1="108" y1="84" x2="420" y2="444" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#36393d"/>
      <stop offset="0.52" stop-color="#25282c"/>
      <stop offset="1" stop-color="#17191c"/>
    </linearGradient>
    <linearGradient id="graphite-soft" x1="220" y1="230" x2="394" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#42454a"/>
      <stop offset="1" stop-color="#202327"/>
    </linearGradient>
    <linearGradient id="ivory" x1="142" y1="144" x2="322" y2="432" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffefa"/>
      <stop offset="0.48" stop-color="#eeeae3"/>
      <stop offset="1" stop-color="#d8d2c8"/>
    </linearGradient>
    <linearGradient id="ivory-face" x1="194" y1="120" x2="356" y2="232" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffefa"/>
      <stop offset="1" stop-color="#e1ddd5"/>
    </linearGradient>
    <linearGradient id="cinnamon" x1="328" y1="135" x2="405" y2="214" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff9c2f"/>
      <stop offset="0.55" stop-color="#f47a20"/>
      <stop offset="1" stop-color="#d95718"/>
    </linearGradient>
    <radialGradient id="eye" cx="42%" cy="32%" r="70%">
      <stop stop-color="#555960"/>
      <stop offset="0.58" stop-color="#25282c"/>
      <stop offset="1" stop-color="#111316"/>
    </radialGradient>
  </defs>

  <!-- Weighty, rounded outer silhouette. -->
  <path fill="url(#graphite)" d="M101 411C65 367 54 306 70 253c11-38 33-69 62-94 17-15 27-38 29-67 3-42 34-70 78-78 44-8 90 3 120 31 18 17 29 36 34 58 5 19 15 31 31 39 28 13 43 41 37 69-3 15-11 27-24 37 25 29 38 65 38 105 0 78-60 137-149 145-91 8-174-23-225-87Z"/>

  <!-- Warm breast with deliberately irregular feather edge. -->
  <path fill="url(#ivory)" d="M148 185c20-20 45-31 75-33 40-2 75 13 101 43 16 18 27 39 34 63-28 5-50 18-66 38-22 28-29 63-21 107l-19-14 1 29-31-22 2 30-32-25 2 28-27-26-2 22c-29-24-50-55-60-91-15-54 0-111 41-149Z"/>

  <!-- Pale cheek mask creates the compact Buteo head, not a falcon helmet. -->
  <path fill="url(#ivory-face)" d="M173 127c28-24 67-34 107-26 38 7 70 27 92 57-18 4-33 12-45 24-12 12-23 17-35 15-19-3-34-15-44-34-12 8-26 12-42 10-17-1-30-8-39-19 9-7 21-16 36-27Z"/>

  <!-- Brow and throat markings anchor the face without a direct stare. -->
  <path fill="#24272b" d="M237 129c18-9 38-9 55 1-16-1-29 3-39 12-6-5-11-9-16-13Zm48 74c16-10 31-13 45-9 15 4 29 15 43 32-17-1-32 3-45 12-13 9-26 10-38 5-12-5-19-15-20-28 5-1 10-5 15-12Z"/>

  <!-- Folded wing retains the round body but adds an intentional shoulder. -->
  <path fill="url(#graphite-soft)" d="M329 273c30-18 62-18 91 1 26 18 41 47 39 81-3 56-43 100-105 119-29 9-58 10-87 4 20-19 32-43 35-71 3-26-1-49-10-69 7-28 19-49 37-65Z"/>
  <path fill="#4c5055" opacity=".55" d="M350 291c25-10 48-7 70 9-24-7-46-4-65 9-22 15-36 37-42 67 0-37 12-66 37-85Z"/>

  <!-- Cinnamon cere and bill, with a compact dark hook. -->
  <path fill="url(#cinnamon)" d="M340 156c11-16 27-23 44-18 15 4 26 16 33 34-18 1-33 8-45 21-12 13-29 19-50 18 14-8 25-18 32-29-4-9-9-18-14-26Z"/>
  <path fill="#202327" d="M397 161c18 2 31 10 39 24 8 15 7 31-3 47-5 8-12 14-21 18 3-10 2-20-2-29-6-13-17-21-33-24 8-13 15-25 20-36Z"/>
  <path fill="#e8681d" d="M322 211c21 1 39-5 55-15 6 4 11 10 15 16-21 2-44 1-70-1Z"/>

  <!-- Off-axis eye and restrained catchlight. -->
  <ellipse cx="274" cy="144" rx="19" ry="21" fill="url(#eye)" transform="rotate(-12 274 144)"/>
  <ellipse cx="268" cy="137" rx="5" ry="4.5" fill="#fff"/>
  <ellipse cx="278" cy="145" rx="3" ry="4" fill="#0d0f11"/>

  <!-- Two restrained breast markings preserve Buteo character without visual noise. -->
  <path fill="#5a514b" d="M199 273c7-5 14-3 17 4-2 8-6 14-12 19-6-7-7-14-5-23Zm35-17c7-5 14-2 16 5-2 8-7 14-13 19-5-8-6-15-3-24Z"/>
</svg>
