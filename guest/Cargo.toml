[workspace]
members = [
    "clipboard-agent",
    "desktop-core",
    "settings",
    "shell",
    "shortcut-helper",
    "sudo-bridge",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/openresearchtools/BuzzardOS"
rust-version = "1.85"

[workspace.dependencies]
accesskit = "0.24"
accesskit_unix = "0.22"
anyhow = "1.0"
fontdue = "0.9"
gio = { version = "0.21.5", features = ["v2_72"] }
glib = { version = "0.21.5", features = ["v2_72"] }
image = { version = "=0.25.8", default-features = false, features = ["bmp", "jpeg", "png", "tiff", "webp"] }
gtk4 = { version = "0.10.3", features = ["v4_10"] }
libc = "0.2"
libpulse-binding = { version = "=2.30.1", default-features = false, features = ["pa_v8"] }
resvg = { version = "0.45", default-features = false }
roxmltree = "0.20"
rustix = { version = "1.1", features = ["fs", "net", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shlex = "2.0"
smithay-client-toolkit = "0.20"
tempfile = "3.20"
thiserror = "2.0"
tiff = "=0.10.3"
uuid = { version = "1.17", features = ["v4", "serde"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "server", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wl-clipboard-rs = { version = "=0.9.3", default-features = false }
zeroize = "=1.8.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
