[workspace]
members = ["shell"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/openresearchtools/BuzzardOS"
rust-version = "1.85"

[workspace.dependencies]
accesskit = "0.24"
accesskit_unix = "0.22"
anyhow = "1.0"
fontdue = "0.9"
image = { version = "=0.25.8", default-features = false, features = ["png"] }
libc = "0.2"
resvg = { version = "0.45", default-features = false }
serde_json = "1.0"
smithay-client-toolkit = "0.20"
tempfile = "3.20"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "server", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
