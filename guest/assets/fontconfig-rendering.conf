<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<fontconfig>
  <!-- Match the native host desktop's LCD rasterization defaults. The guest
       compositor produces an opaque, normal-orientation RGB monitor buffer,
       so clients can render glyphs at the final pixel grid instead of using
       deliberately soft grayscale-only stems. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
