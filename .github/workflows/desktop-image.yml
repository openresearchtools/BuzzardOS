name: Desktop image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - images/desktop/**
      - scripts/verify-stock-sway-contract.sh
      - third_party/trycua-cua/**
      - .github/workflows/desktop-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/openresearchtools/buzzardos-desktop
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/desktop/Containerfile
          load: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify reference image contract
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -euo pipefail
          image=$(sed -n '1p' <<<"$IMAGE_TAGS")
          docker run --rm --entrypoint /bin/sh "$image" -ec '
            test "$(stat -c "%u:%g:%a" /home/wildbuzzard)" = "1000:1000:700"
            test "$(stat -c "%u:%g:%a" /home/wildbuzzard/.config)" = "1000:1000:700"
            for command in \
              Xwayland chromium cua-driver dbus-daemon dolphin foot \
              grim mako pipewire sway swaymsg systemctl wireplumber \
              wildbuzzard-electron-demo wtype
            do
              command -v "$command" >/dev/null
            done
            test -x /opt/electron/electron
            test -x /usr/libexec/wildbuzzard-shell
            dpkg-query -W at-spi2-core fonts-noto-color-emoji \
              fonts-noto-core fonts-noto-cjk python3-pyatspi pipewire \
              wireplumber xwayland >/dev/null
            test -s /usr/share/doc/wildbuzzard-cua/LICENSE.trycua-cua.md
            grep -F 10279552e2bbe479e367a082f78b1b98ee85a697 \
              /usr/share/doc/wildbuzzard-cua/UPSTREAM.toml
            grep -F 88869399f421d9180dd8b6ed0b5a1f4a3585d252 \
              /usr/share/doc/wildbuzzard-sway/UPSTREAM.toml
            grep -F d783533489e1f75d6886c2ab5c5960090ef268f8 \
              /usr/share/doc/wildbuzzard-sway/UPSTREAM.toml
            test -s /usr/share/doc/wildbuzzard-sway/LICENSE.sway
            test -s /usr/share/doc/wildbuzzard-sway/LICENSE.wlroots
            for forbidden in blender kwin_wayland wayfire labwc waybar fuzzel
            do
              ! command -v "$forbidden" >/dev/null 2>&1
            done
            for unit in \
              sys-kernel-config.mount \
              sys-kernel-debug.mount \
              sys-kernel-tracing.mount
            do
              test "$(readlink "/etc/systemd/system/$unit")" = /dev/null
            done
          '
      - name: Publish verified reference image
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r image; do
            test -n "$image"
            docker push "$image"
          done <<<"$IMAGE_TAGS"
