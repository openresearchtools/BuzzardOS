name: Build and publish Buzzard OS Debian packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: buzzardos-debs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Buzzard OS Debian packages
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release sources
        shell: bash
        run: |
          set -euo pipefail
          bash -n packaging/build-debs.sh oci/build-local.sh oci/verify-image.sh
          python3 -m unittest oci.tests.test_build_contract
          ./tools/check-licenses.sh --structural

      - name: Install Ubuntu 24.04 package-build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils build-essential buildah curl dpkg-dev libglib2.0-dev libgtk-4-dev \
            libpulse-dev libx11-dev libxfixes-dev libxi-dev libxkbcommon-dev \
            libxrandr-dev libxtst-dev pkg-config python3
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Build the four versioned Debian packages
        shell: bash
        run: |
          set -euo pipefail
          build_root="$RUNNER_TEMP/buzzardos-deb-build"
          output="$RUNNER_TEMP/buzzardos-debs"
          BUZZARDOS_DEB_BUILD_ROOT="$build_root" \
          BUZZARDOS_DEB_OUTPUT_DIR="$output" \
            packaging/build-debs.sh all
          version=$(tr -d '\n' <VERSION)
          guest_version=$(tr -d '\n' <guest/GUEST_VERSION)
          desktop_version=$(tr -d '\n' <guest/DESKTOP_VERSION)
          cua_version=$(tr -d '\n' <cua/VERSION)
          license_audit=(./tools/check-licenses.sh --structural)
          for package in \
            "$output/buzzardos_${version}_amd64.deb" \
            "$output/buzzardos-guest_${guest_version}_amd64.deb" \
            "$output/buzzardos-desktop_${desktop_version}_amd64.deb" \
            "$output/buzzardoscua_${cua_version}_amd64.deb"; do
            test -s "$package"
            dpkg-deb --info "$package" >/dev/null
            dpkg-deb --contents "$package" >/dev/null
            (
              cd "$output"
              sha256sum --check --strict "$(basename "$package").sha256"
            )
            license_audit+=(--deb "$package")
          done
          "${license_audit[@]}"

      - name: Install-smoke the host package on every supported host distribution
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\n' <VERSION)
          BUZZARDOS_CONTAINER_RUNTIME=docker \
            tools/test-host-package-matrix.sh \
              "$RUNNER_TEMP/buzzardos-debs/buzzardos_${version}_amd64.deb"

      - name: Build and verify the stock-Sway reference OCI locally
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          BUZZARDOS_BUILD_ROOT="$RUNNER_TEMP/buzzardos-oci-build" \
          BUZZARDOS_OCI_TAG="buzzardos-desktop:actions-${GITHUB_RUN_ID}" \
            ./oci/build-local.sh

      - name: Upload the Debian package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BuzzardOS-debian-packages-amd64
          path: |
            ${{ runner.temp }}/buzzardos-debs/*.deb
            ${{ runner.temp }}/buzzardos-debs/*.deb.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Publish newly versioned packages on a version tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t built_assets < <(
            find "$RUNNER_TEMP/buzzardos-debs" -maxdepth 1 -type f \
              \( -name '*.deb' -o -name '*.deb.sha256' \) -print | sort
          )
          test "${#built_assets[@]}" -eq 8

          # Components have independent versions. A tag still builds and
          # audits all four packages, but a stable release must not republish
          # an unchanged Package/Version/Architecture tuple that the central
          # APT catalogue already indexes from an earlier release.
          declare -A published=()
          while IFS=$'\t' read -r tag asset_name; do
            if [[ -n "$asset_name" && "$tag" != "$GITHUB_REF_NAME" ]]; then
              published["$asset_name"]=1
            fi
          done < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] as $release | $release.assets[]? | [$release.tag_name, .name] | @tsv'
          )

          assets=()
          for candidate in "${built_assets[@]}"; do
            asset_name=$(basename "$candidate")
            if [[ -z "${published[$asset_name]+present}" ]]; then
              assets+=("$candidate")
            fi
          done
          test "${#assets[@]}" -gt 0
          test "$(( ${#assets[@]} % 2 ))" -eq 0
          for candidate in "${assets[@]}"; do
            if [[ "$candidate" == *.deb ]]; then
              test -s "$candidate.sha256"
            fi
          done
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --title "Buzzard OS $GITHUB_REF_NAME" \
              --generate-notes
          fi
