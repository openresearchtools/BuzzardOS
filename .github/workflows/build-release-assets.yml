name: Build Actions artifacts

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: wildbuzzard-actions-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-request:
    name: Validate artifact build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release assembly tooling
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends zstd
          fi
          bash -n \
            host/build-appimage.sh \
            tools/assemble-release-assets.sh \
            tools/build-release-rootfs.sh \
            tools/create-project-source-archive.sh
          python3 -m py_compile \
            tools/license_audit.py \
            tools/release_metadata.py
          python3 -m unittest discover -s tools/tests -v

      - name: Enforce artifact-only policy
        shell: bash
        run: |
          set -euo pipefail
          printf 'Actions-artifact-only workflow; no release or package publisher exists.\n'
          ./tools/check-licenses.sh --structural

  build-appimage:
    name: Build standalone AppImage
    needs: validate-request
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 360
    env:
      APPIMAGE_BUILD_IMAGE: wildbuzzard-appimage-build:${{ github.run_id }}
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize runner-local output paths
        shell: bash
        run: |
          set -euo pipefail
          echo "APPIMAGE_OUTPUT=$RUNNER_TEMP/wildbuzzard-appimage-output/WildBuzzard-x86_64.AppImage" >>"$GITHUB_ENV"

      - name: Create pinned Ubuntu 26.04 AppImage build environment
        shell: bash
        run: |
          set -euo pipefail
          build_environment="$RUNNER_TEMP/wildbuzzard-appimage-build.Dockerfile"
          cat >"$build_environment" <<'EOF'
          FROM rust:1.96.0-bookworm@sha256:c993d32d95cc146bd12c84d66f0b924a6a96f3988325f39c144f2f9893dea120 AS rust-toolchain
          FROM ubuntu:26.04@sha256:7b202b0e2e0028c6250f5fcf41d04df492d145a1654c6995a6553f0c1f6f1960
          COPY --from=rust-toolchain /usr/local/cargo /usr/local/cargo
          COPY --from=rust-toolchain /usr/local/rustup /usr/local/rustup
          ENV PATH=/usr/local/cargo/bin:${PATH}
          ENV RUSTUP_HOME=/usr/local/rustup
          ENV CARGO_HOME=/usr/local/cargo
          RUN export DEBIAN_FRONTEND=noninteractive; \
              apt-get update; \
              apt-get install --yes --no-install-recommends \
                apparmor \
                binutils \
                bubblewrap \
                build-essential \
                ca-certificates \
                curl \
                desktop-file-utils \
                dpkg-dev \
                file \
                fuse3 \
                git \
                gstreamer1.0-pipewire \
                gstreamer1.0-plugins-bad \
                gstreamer1.0-plugins-base \
                gstreamer1.0-plugins-good \
                gstreamer1.0-tools \
                libdrm-dev \
                libfuse3-dev \
                libgbm-dev \
                libgraphene-1.0-dev \
                libgtk-4-dev \
                libpipewire-0.3-dev \
                libpulse-dev \
                libslirp0 \
                libspa-0.2-modules \
                libwayland-dev \
                libx11-dev \
                libxfixes-dev \
                libxi-dev \
                libxkbcommon-dev \
                libxrandr-dev \
                libxtst-dev \
                make \
                ninja-build \
                patch \
                patchelf \
                pipewire-bin \
                pkg-config \
                python3 \
                squashfs-tools \
                unzip \
                util-linux \
                xz-utils \
                zstd; \
              rm -rf /var/lib/apt/lists/*
          EOF
          docker build \
            --platform linux/amd64 \
            --file "$build_environment" \
            --tag "$APPIMAGE_BUILD_IMAGE" \
            "$RUNNER_TEMP"

      - name: Build and structurally audit the AppImage
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -c /dev/fuse ]]; then
            sudo modprobe fuse
          fi
          test -c /dev/fuse || {
            echo 'GitHub runner did not provide the FUSE device required by the AppImage runtime self-test' >&2
            exit 1
          }
          mkdir -p \
            "$RUNNER_TEMP/wildbuzzard-appimage-build" \
            "$RUNNER_TEMP/wildbuzzard-appimage-output" \
            "$RUNNER_TEMP/wildbuzzard-guest-runtime"
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --target sway-runtime-artifact \
            --output "type=local,dest=$RUNNER_TEMP/wildbuzzard-guest-runtime" \
            --file "$GITHUB_WORKSPACE/oci/desktop/Containerfile" \
            "$GITHUB_WORKSPACE"
          docker run --rm \
            --platform linux/amd64 \
            --device /dev/fuse:/dev/fuse \
            --cap-add SYS_ADMIN \
            --security-opt apparmor=unconfined \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$RUNNER_TEMP/wildbuzzard-appimage-build:/build" \
            --volume "$RUNNER_TEMP/wildbuzzard-appimage-output:/output" \
            --volume "$RUNNER_TEMP/wildbuzzard-guest-runtime:/guest-runtime:ro" \
            --env WILDBUZZARD_BUILD_ROOT=/build \
            --env WILDBUZZARD_OUTPUT_DIR=/output \
            --env WILDBUZZARD_GUEST_RUNTIME_PAYLOAD=/guest-runtime \
            --env OUTPUT_UID="$(id -u)" \
            --env OUTPUT_GID="$(id -g)" \
            "$APPIMAGE_BUILD_IMAGE" \
            bash -euo pipefail -c '
              git config --global --add safe.directory /workspace
              rustc --version
              pkg-config --modversion gtk4
              /workspace/host/build-appimage.sh
              chown -R "$OUTPUT_UID:$OUTPUT_GID" /output
            '
          test -x "$APPIMAGE_OUTPUT"
          test "$(stat -c '%s' -- "$APPIMAGE_OUTPUT")" -lt 2147483648 || {
            echo "standalone AppImage is not smaller than GitHub's 2 GiB asset limit" >&2
            exit 1
          }
          APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE_OUTPUT" --version
          (
            cd "$(dirname -- "$APPIMAGE_OUTPUT")"
            sha256sum WildBuzzard-x86_64.AppImage >SHA256SUMS
          )

      - name: Release AppImage builder scratch space
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          docker image rm --force "$APPIMAGE_BUILD_IMAGE" >/dev/null 2>&1 || true
          docker builder prune --all --force >/dev/null
          build_scratch="$RUNNER_TEMP/wildbuzzard-appimage-build"
          if [[ -d "$build_scratch" ]]; then
            sudo find "$build_scratch" -mindepth 1 -delete
          fi
          if [[ -d "$RUNNER_TEMP/wildbuzzard-guest-runtime" ]]; then
            sudo find "$RUNNER_TEMP/wildbuzzard-guest-runtime" -mindepth 1 -delete
          fi
          test ! -e "$APPIMAGE_OUTPUT" || test -s "$APPIMAGE_OUTPUT"

      - name: Upload standalone AppImage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WildBuzzard-x86_64.AppImage
          path: |
            ${{ runner.temp }}/wildbuzzard-appimage-output/WildBuzzard-x86_64.AppImage
            ${{ runner.temp }}/wildbuzzard-appimage-output/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  build-portable:
    name: Build complete portable bundle
    needs:
      - validate-request
      - build-appimage
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 360
    env:
      CI_APPIMAGE_DIR: /opt/wildbuzzard-actions-${{ github.run_id }}-${{ github.run_attempt }}
      CI_APPIMAGE_INPUT: /opt/wildbuzzard-actions-${{ github.run_id }}-${{ github.run_attempt }}/WildBuzzard-x86_64.AppImage
      CI_APPARMOR_PROFILE: wildbuzzard_actions_${{ github.run_id }}_${{ github.run_attempt }}
      CI_APPARMOR_POLICY: /opt/wildbuzzard-actions-${{ github.run_id }}-${{ github.run_attempt }}/wildbuzzard-userns.apparmor
      CI_APPARMOR_MARKER: /opt/wildbuzzard-actions-${{ github.run_id }}-${{ github.run_attempt }}/.apparmor-loaded
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the exact standalone AppImage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: WildBuzzard-x86_64.AppImage
          path: ${{ runner.temp }}/wildbuzzard-appimage-input

      - name: Initialize runner-local output paths
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "APPIMAGE_INPUT=$RUNNER_TEMP/wildbuzzard-appimage-input/WildBuzzard-x86_64.AppImage"
            echo "RELEASE_OUTPUT=$RUNNER_TEMP/wildbuzzard-release-assets"
            echo "ROOTFS_STAGE=$RUNNER_TEMP/wildbuzzard-rootfs-stage"
          } >>"$GITHUB_ENV"

      - name: Install runner-only assembly tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            acl \
            apparmor \
            attr \
            jq \
            rsync \
            skopeo \
            squashfs-tools \
            uidmap \
            zstd
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          docker buildx version
          chmod 0755 "$APPIMAGE_INPUT"
          (
            cd "$(dirname -- "$APPIMAGE_INPUT")"
            sha256sum --check SHA256SUMS
          )
          appimage_sha256=$(sha256sum "$APPIMAGE_INPUT" | awk '{print $1}')
          [[ "$appimage_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "APPIMAGE_SHA256=$appimage_sha256" >>"$GITHUB_ENV"

      - name: Prepare exact-path rootless namespace policy
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0 || {
            echo 'the recipient-path namespace test must run as the ordinary runner user' >&2
            exit 1
          }
          [[ "$CI_APPIMAGE_DIR" =~ ^/opt/wildbuzzard-actions-[0-9]+-[0-9]+$ ]]
          [[ "$CI_APPIMAGE_INPUT" == "$CI_APPIMAGE_DIR/WildBuzzard-x86_64.AppImage" ]]
          [[ "$CI_APPARMOR_POLICY" == "$CI_APPIMAGE_DIR/wildbuzzard-userns.apparmor" ]]
          [[ "$CI_APPARMOR_MARKER" == "$CI_APPIMAGE_DIR/.apparmor-loaded" ]]
          [[ "$CI_APPARMOR_PROFILE" =~ ^wildbuzzard_actions_[0-9]+_[0-9]+$ ]]
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1 || {
            echo 'runner must retain Ubuntu unprivileged-userns restriction during the smoke test' >&2
            exit 1
          }

          profile_loaded=false
          profile_staging=
          cleanup_failed_setup() {
            status=$?
            trap - EXIT
            if [[ -n "$profile_staging" ]]; then
              rm -f -- "$profile_staging"
            fi
            if [[ "$status" -ne 0 ]]; then
              if [[ "$profile_loaded" == true ]]; then
                sudo apparmor_parser -K -R "$CI_APPARMOR_POLICY" || true
              fi
              sudo rm -rf -- "$CI_APPIMAGE_DIR"
            fi
            exit "$status"
          }
          trap cleanup_failed_setup EXIT

          sudo install -d -o root -g root -m 0755 "$CI_APPIMAGE_DIR"
          sudo install -o root -g root -m 0555 \
            "$APPIMAGE_INPUT" "$CI_APPIMAGE_INPUT"
          cmp "$APPIMAGE_INPUT" "$CI_APPIMAGE_INPUT"
          test -f "$CI_APPIMAGE_INPUT" && test ! -L "$CI_APPIMAGE_INPUT"
          test "$(stat -c '%u:%g:%a' "$CI_APPIMAGE_INPUT")" = '0:0:555'
          test "$(sha256sum "$CI_APPIMAGE_INPUT" | awk '{print $1}')" = \
            "$APPIMAGE_SHA256"

          profile_staging=$(mktemp "$RUNNER_TEMP/wildbuzzard-userns-profile.XXXXXX")
          printf '%s\n' \
            'abi <abi/4.0>,' \
            'include <tunables/global>' \
            '' \
            "profile $CI_APPARMOR_PROFILE \"$CI_APPIMAGE_INPUT\" flags=(unconfined) {" \
            '  userns,' \
            '}' >"$profile_staging"
          sudo install -o root -g root -m 0600 \
            "$profile_staging" "$CI_APPARMOR_POLICY"
          rm -f -- "$profile_staging"
          profile_staging=
          sudo apparmor_parser -K -a "$CI_APPARMOR_POLICY"
          profile_loaded=true
          sudo install -o root -g root -m 0400 /dev/null "$CI_APPARMOR_MARKER"
          echo "APPIMAGE_INPUT=$CI_APPIMAGE_INPUT" >>"$GITHUB_ENV"
          trap - EXIT

      - name: Verify the exact rootless subordinate-ID path
        shell: bash
        run: |
          set -euo pipefail
          doctor_output="$RUNNER_TEMP/wildbuzzard-rootless-doctor.txt"
          doctor_storage="$RUNNER_TEMP/wildbuzzard-rootless-doctor-storage"
          mkdir -p "$doctor_storage"
          cleanup_doctor_storage() {
            rm -rf -- "$doctor_storage"
          }
          trap cleanup_doctor_storage EXIT
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE_INPUT" \
            --storage-dir "$doctor_storage" doctor \
            >"$doctor_output" 2>&1
          doctor_status=$?
          set -e
          cat "$doctor_output"
          grep -Eq \
            '^[[:space:]]*full UID/GID mapping: yes \(required\)$' \
            "$doctor_output" || {
              echo 'the exact AppImage could not construct its full keep-ID subordinate UID/GID map' >&2
              exit 1
            }
          printf 'Rootless ID-map preflight passed (doctor exit %s; headless runner checks may remain unavailable).\n' \
            "$doctor_status"

      - name: Build and verify flattened rootfs payload
        shell: bash
        run: |
          set -euo pipefail
          ./tools/build-release-rootfs.sh "$APPIMAGE_INPUT" "$ROOTFS_STAGE"

      - name: Assemble and verify the complete distribution
        shell: bash
        run: |
          set -euo pipefail
          ./tools/assemble-release-assets.sh \
            "$APPIMAGE_INPUT" \
            "$ROOTFS_STAGE" \
            "$RELEASE_OUTPUT"
          test -x "$RELEASE_OUTPUT/WildBuzzard-x86_64.AppImage"
          test -s "$RELEASE_OUTPUT/WildBuzzard-portable-x86_64.tar.zst"
          test -s "$RELEASE_OUTPUT/SHA256SUMS"
          cmp "$APPIMAGE_INPUT" "$RELEASE_OUTPUT/WildBuzzard-x86_64.AppImage"
          (cd "$RELEASE_OUTPUT" && sha256sum --check SHA256SUMS)

      - name: Remove runner-only namespace policy
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CI_APPIMAGE_DIR" =~ ^/opt/wildbuzzard-actions-[0-9]+-[0-9]+$ ]]
          [[ "$CI_APPARMOR_POLICY" == "$CI_APPIMAGE_DIR/wildbuzzard-userns.apparmor" ]]
          [[ "$CI_APPARMOR_MARKER" == "$CI_APPIMAGE_DIR/.apparmor-loaded" ]]
          if [[ -e "$CI_APPARMOR_MARKER" ]]; then
            sudo apparmor_parser -K -R "$CI_APPARMOR_POLICY"
          fi
          if [[ -d "$CI_APPIMAGE_DIR" ]]; then
            sudo rm -rf -- "$CI_APPIMAGE_DIR"
          fi
          test ! -e "$CI_APPIMAGE_DIR"

      - name: Upload complete portable-bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WildBuzzard-portable-x86_64.tar.zst
          path: |
            ${{ runner.temp }}/wildbuzzard-release-assets/WildBuzzard-portable-x86_64.tar.zst
            ${{ runner.temp }}/wildbuzzard-release-assets/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
