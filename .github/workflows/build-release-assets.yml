name: Build portable Actions artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buzzardos-portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-portable:
    name: Build Buzzard OS portable folder
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BUILD_IMAGE: buzzardos-portable-builder:${{ github.run_id }}
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce artifact-only workflow and validate sources
        shell: bash
        run: |
          set -euo pipefail
          bash -n \
            host/build-portable-app.sh \
            host/packaging/AppRun \
            host/packaging/BuzzardOS \
            host/packaging/Install-Dependencies \
            tools/build-release-rootfs.sh \
            tools/assemble-release-assets.sh
          python3 -m py_compile tools/license_audit.py tools/release_metadata.py
          python3 -m unittest discover -s tools/tests -v
          ./tools/check-licenses.sh --structural
          # Bracket the final character so this guard cannot match its own
          # source line while still rejecting release/publish actions.
          ! grep -Eq 'uses: .*(releas[e]|publis[h])' \
            .github/workflows/build-release-assets.yml

      - name: Install disposable runner build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            acl attr jq lxc rsync skopeo uidmap xz-utils zstd
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          docker buildx version

      - name: Create pinned Ubuntu 26.04 application build environment
        shell: bash
        run: |
          set -euo pipefail
          build_environment="$RUNNER_TEMP/buzzardos-portable-builder.Dockerfile"
          cat >"$build_environment" <<'EOF'
          FROM rust:1.96.0-bookworm@sha256:c993d32d95cc146bd12c84d66f0b924a6a96f3988325f39c144f2f9893dea120 AS rust-toolchain
          FROM ubuntu:26.04@sha256:7b202b0e2e0028c6250f5fcf41d04df492d145a1654c6995a6553f0c1f6f1960
          COPY --from=rust-toolchain /usr/local/cargo /usr/local/cargo
          COPY --from=rust-toolchain /usr/local/rustup /usr/local/rustup
          ENV PATH=/usr/local/cargo/bin:${PATH}
          ENV RUSTUP_HOME=/usr/local/rustup
          ENV CARGO_HOME=/usr/local/cargo
          RUN export DEBIAN_FRONTEND=noninteractive; \
              apt-get update; \
              apt-get install --yes --no-install-recommends \
                binutils bubblewrap build-essential ca-certificates curl \
                desktop-file-utils dpkg-dev file fuse3 git \
                gstreamer1.0-pipewire gstreamer1.0-plugins-bad \
                gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
                gstreamer1.0-tools libdrm-dev libfuse3-dev libgbm-dev \
                libgraphene-1.0-dev libgtk-4-dev libpipewire-0.3-dev \
                libpulse-dev libslirp0 libspa-0.2-modules libwayland-dev \
                libx11-dev libxfixes-dev libxi-dev libxkbcommon-dev \
                libxrandr-dev libxtst-dev make ninja-build patch patchelf \
                pipewire-bin pkg-config python3 squashfs-tools unzip \
                util-linux xz-utils zstd; \
              rm -rf /var/lib/apt/lists/*
          EOF
          docker build --platform linux/amd64 \
            --file "$build_environment" --tag "$BUILD_IMAGE" "$RUNNER_TEMP"

      - name: Build dependency-complete native application folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            "$RUNNER_TEMP/buzzardos-build" \
            "$RUNNER_TEMP/buzzardos-app-output" \
            "$RUNNER_TEMP/buzzardos-guest-runtime" \
            "$RUNNER_TEMP/BuzzardOS"
          docker buildx build \
            --platform linux/amd64 --provenance=false --sbom=false \
            --target sway-runtime-artifact \
            --output "type=local,dest=$RUNNER_TEMP/buzzardos-guest-runtime" \
            --file oci/desktop/Containerfile .
          docker run --rm --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$RUNNER_TEMP/buzzardos-build:/build" \
            --volume "$RUNNER_TEMP/buzzardos-app-output:/output" \
            --volume "$RUNNER_TEMP/buzzardos-guest-runtime:/guest-runtime:ro" \
            --env WILDBUZZARD_BUILD_ROOT=/build \
            --env WILDBUZZARD_OUTPUT_DIR=/output \
            --env WILDBUZZARD_GUEST_RUNTIME_PAYLOAD=/guest-runtime \
            --env OUTPUT_UID="$(id -u)" --env OUTPUT_GID="$(id -g)" \
            "$BUILD_IMAGE" bash -euo pipefail -c '
              git config --global --add safe.directory /workspace
              /workspace/host/build-portable-app.sh
              chown -R "$OUTPUT_UID:$OUTPUT_GID" /output
            '
          mv "$RUNNER_TEMP/buzzardos-app-output/app" "$RUNNER_TEMP/BuzzardOS/app"
          install -m0755 host/packaging/BuzzardOS "$RUNNER_TEMP/BuzzardOS/BuzzardOS"
          install -m0755 host/packaging/Install-Dependencies "$RUNNER_TEMP/BuzzardOS/Install-Dependencies"
          docker run --rm --platform linux/amd64 \
            --volume "$RUNNER_TEMP/BuzzardOS:/portable:ro" \
            "$BUILD_IMAGE" /portable/BuzzardOS --version

      - name: Build verified OCI seed and assemble portable archive
        shell: bash
        run: |
          set -euo pipefail
          rootfs_stage="$RUNNER_TEMP/buzzardos-rootfs-stage"
          release_output="$RUNNER_TEMP/buzzardos-release"
          ./tools/build-release-rootfs.sh "$RUNNER_TEMP/BuzzardOS" "$rootfs_stage"
          ./tools/assemble-release-assets.sh \
            "$RUNNER_TEMP/BuzzardOS" "$rootfs_stage" "$release_output"
          archive="$release_output/BuzzardOS-portable-linux-x86_64.tar.xz"
          checksum="$archive.sha256"
          test -s "$archive"
          test -s "$checksum"
          xz -t "$archive"
          (cd "$release_output" && sha256sum --check --strict "$(basename "$checksum")")
          [[ "$(tar -tJf "$archive" | sed -n '1s,/.*,,p')" == BuzzardOS ]]

      - name: Remove disposable build state
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          docker image rm --force "$BUILD_IMAGE" >/dev/null 2>&1 || true
          docker builder prune --all --force >/dev/null 2>&1 || true
          for path in \
            "$RUNNER_TEMP/buzzardos-build" \
            "$RUNNER_TEMP/buzzardos-app-output" \
            "$RUNNER_TEMP/buzzardos-guest-runtime" \
            "$RUNNER_TEMP/buzzardos-rootfs-stage"; do
            if [[ -d "$path" ]]; then sudo find "$path" -mindepth 1 -delete; fi
          done

      - name: Upload the single portable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BuzzardOS-portable-linux-x86_64.tar.xz
          path: |
            ${{ runner.temp }}/buzzardos-release/BuzzardOS-portable-linux-x86_64.tar.xz
            ${{ runner.temp }}/buzzardos-release/BuzzardOS-portable-linux-x86_64.tar.xz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
