name: Hardware acceptance

on:
  workflow_dispatch:
    inputs:
      machine:
        description: Dedicated persistent machine name
        required: true
        default: acceptance
      install_package:
        description: Install and persistence-test the Debian hello package
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  sway-wayland-nvidia:
    runs-on: [self-hosted, linux, x64, wayland, nvidia]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: ./scripts/build-appimage.sh
      - name: Persistent one-window desktop acceptance
        env:
          WILDBUZZARD_ACCEPT_INSTALL_PACKAGE: ${{ inputs.install_package && '1' || '0' }}
          WILDBUZZARD_ACCEPT_FULL_MATRIX: "1"
        run: ./scripts/hardware-acceptance.sh ./dist/WildBuzzard-x86_64.AppImage "${{ inputs.machine }}"
